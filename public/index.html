<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llama AI</title>

  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="/tailwind.css" />

  <!-- Custom Markdown Styles -->
  <link rel="stylesheet" href="/style.css" />

  <!-- Local deferred scripts -->
  <script src="/marked.min.js" defer></script>
  <script src="/purify.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>

<body class="bg-zinc-50 text-zinc-900 antialiased h-screen overflow-hidden flex flex-col">

  <!-- Main App Container -->
  <div class="max-w-3xl w-full h-full mx-auto flex flex-col bg-white sm:border-x sm:border-zinc-200/80">

    <!-- Header -->
    <header class="h-16 px-6 flex items-center justify-between border-b border-zinc-100 shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-zinc-900 text-white flex items-center justify-center text-sm font-semibold shadow-sm">
          ✦
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-zinc-900">Llama 3.2</h1>
          <p class="text-[11px] text-zinc-400">Local Private Workspace</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          Online
        </span>
        <button
          id="clearBtn"
          class="text-xs font-medium text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 px-3 py-1.5 rounded-lg border border-zinc-200/80 transition cursor-pointer"
        >
          New Chat
        </button>
      </div>
    </header>

    <!-- Chat Messages Area -->
    <main id="chatbox" class="flex-1 overflow-y-auto px-5 sm:px-10 py-8 flex flex-col gap-6 scroll-smooth">
      <div id="welcome" class="m-auto text-center max-w-sm px-4">
        <div class="w-12 h-12 rounded-2xl bg-zinc-100 text-zinc-800 flex items-center justify-center text-xl mx-auto mb-4">
          ✦
        </div>
        <h2 class="text-xl font-semibold tracking-tight text-zinc-900 mb-2">How can I help today?</h2>
        <p class="text-xs text-zinc-500 leading-relaxed mb-6">
          Running locally with zero external API keys. Ask a question, write code, or brainstorm ideas.
        </p>
        <div class="flex flex-wrap justify-center gap-2">
          <button
            data-prompt="Explain how Transformers work simply"
            class="starter-btn text-xs text-zinc-600 bg-zinc-50 hover:bg-zinc-100 border border-zinc-200/80 px-3 py-1.5 rounded-full transition cursor-pointer"
          >
            Explain Transformers
          </button>
          <button
            data-prompt="Write a clean Express.js REST API example"
            class="starter-btn text-xs text-zinc-600 bg-zinc-50 hover:bg-zinc-100 border border-zinc-200/80 px-3 py-1.5 rounded-full transition cursor-pointer"
          >
            Express API snippet
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Input Bar -->
    <footer class="p-4 sm:px-8 sm:pb-6 bg-white shrink-0">
      <div class="max-w-2xl mx-auto">
        <div class="flex items-end gap-2 bg-zinc-50 border border-zinc-200 focus-within:border-zinc-400 focus-within:bg-white focus-within:ring-4 focus-within:ring-zinc-100 rounded-2xl px-4 py-2.5 transition">
          <textarea
            id="input"
            rows="1"
            placeholder="Message Llama..."
            class="flex-1 bg-transparent border-none outline-none resize-none text-sm text-zinc-900 placeholder-zinc-400 max-h-32 py-1 leading-relaxed"
          ></textarea>

          <button
            id="sendBtn"
            aria-label="Send message"
            class="w-8 h-8 rounded-xl bg-zinc-900 hover:bg-zinc-700 disabled:opacity-40 disabled:hover:bg-zinc-900 text-white flex items-center justify-center shrink-0 transition cursor-pointer"
          >
            <svg xmlns="http://w3.org" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
              <path fill-rule="evenodd" d="M10 17a.75.75 0 01-.75-.75V5.612L5.29 9.77a.75.75 0 01-1.08-1.04l5.25-5.5a.75.75 0 011.08 0l5.25 5.5a.75.75 0 11-1.08 1.04l-3.96-4.158V16.25A.75.75 0 0110 17z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
        <p class="text-center text-[11px] text-zinc-400 mt-2.5">
          Press <kbd class="font-sans text-zinc-500">Enter</kbd> to send · <kbd class="font-sans text-zinc-500">Shift + Enter</kbd> for new line
        </p>
      </div>
    </footer>

  </div>
</body>
</html>
