<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyless Open-Source Chatbot</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    #chatbox { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    .msg { margin-bottom: 12px; line-height: 1.4; }
    .user { color: #0056b3; font-weight: bold; }
    .bot { color: #222; }
    #controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Local Llama 3.2 Chatbot (No API Key)</h2>
  <div id="chatbox"></div>
  <div id="controls">
    <input type="text" id="input" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      chatbox.innerHTML += `<div class="msg user">You: ${text}</div>`;
      input.value = '';
      chatbox.scrollTop = chatbox.scrollHeight;

      const loadingId = 'loading-' + Date.now();
      chatbox.innerHTML += `<div class="msg bot" id="${loadingId}"><em>Thinking...</em></div>`;

      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();

      document.getElementById(loadingId).innerHTML = `<strong>Bot:</strong> ${data.reply || data.error}`;
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
